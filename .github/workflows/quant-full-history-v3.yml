name: A-share SHSZ Full History V3

on:
  push:
    paths:
      - ".github/workflows/quant-full-history-v3.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "start / continue / reset"
        required: true
        default: "continue"
        type: choice
        options:
          - continue
          - start
          - reset

permissions:
  contents: write
  actions: write

concurrency:
  group: ashare-shsz-full-history-v3
  cancel-in-progress: false

env:
  START_DATE: "2016-01-01"
  CHUNK_SIZE: "200"
  CHECKPOINT_EVERY: "50"
  SINGLE_STOCK_TIMEOUT: "90"
  SINGLE_STOCK_MAX_ATTEMPTS: "2"
  BATCH_MAX_ATTEMPTS: "3"
  BATCH_RETRY_DELAY: "20"
  DISPATCH_MAX_ATTEMPTS: "3"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "baostock>=0.9.4" "pandas>=2.2" "numpy>=1.26" "pyarrow>=15" "akshare>=1.17"

      - name: Restore latest cumulative cache and checkpoint
        uses: actions/cache/restore@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ashare-shsz-full-v3-

      - name: Reset state when requested
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'reset'
        run: |
          rm -rf quant_research/full_cache
          rm -rf quant_research/state/full_v3
          mkdir -p quant_research/full_cache/daily quant_research/state/full_v3

      - name: Collect next sequential chunk with checkpoints, hard timeouts and batch retries
        shell: bash
        run: |
          status=1
          for attempt in $(seq 1 "$BATCH_MAX_ATTEMPTS"); do
            echo "V3 batch attempt ${attempt}/$BATCH_MAX_ATTEMPTS"
            set +e
            python quant_research/scripts/full_history_v3_hard_timeout.py
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "V3 batch completed successfully"
              exit 0
            fi

            echo "V3 batch attempt ${attempt} failed with exit code ${status}"
            if [ "$attempt" -lt "$BATCH_MAX_ATTEMPTS" ]; then
              delay=$((BATCH_RETRY_DELAY * attempt))
              echo "Retrying from durable checkpoint in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "V3 batch exhausted $BATCH_MAX_ATTEMPTS attempts"
          exit "$status"

      - name: Commit progress and compact manifests
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_research/state/full_v3/

          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "quant: advance SHSZ full-history cursor"

          # GitHub occasionally returns a transient 500 while accepting a push.
          # Retry fetch/rebase/push; never force-push or discard the local commit.
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "State push attempt ${attempt}/${max_attempts}"

            if ! git fetch origin main; then
              echo "git fetch failed on attempt ${attempt}"
            else
              if ! git rebase origin/main; then
                echo "Rebase conflict detected; aborting safely for manual reconciliation"
                git rebase --abort || true
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "State commit pushed successfully on attempt ${attempt}"
                exit 0
              fi
              echo "git push failed on attempt ${attempt}"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((10 * attempt))
              echo "Retrying state push in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "Unable to push state after ${max_attempts} attempts"
          exit 1

      - name: Save cumulative history cache and checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Read completion state
        id: state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path("quant_research/state/full_v3/progress.json")
          d = json.loads(p.read_text())
          print(f"completed={'true' if d.get('completed') else 'false'}")
          print(f"cursor={d.get('cursor', 0)}")
          print(f"universe_size={d.get('universe_size', 0)}")
          PY

      - name: Self-dispatch next chunk
        if: steps.state.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Dispatching next sequential chunk at cursor ${{ steps.state.outputs.cursor }}/${{ steps.state.outputs.universe_size }}"
          for attempt in $(seq 1 "$DISPATCH_MAX_ATTEMPTS"); do
            if gh workflow run quant-full-history-v3.yml --ref main -f action=continue; then
              echo "Self-dispatch succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Self-dispatch attempt ${attempt}/$DISPATCH_MAX_ATTEMPTS failed"
            if [ "$attempt" -lt "$DISPATCH_MAX_ATTEMPTS" ]; then
              sleep $((10 * attempt))
            fi
          done
          echo "Self-dispatch exhausted retries"
          exit 1

      - name: Upload compact state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shsz-full-v3-state-${{ github.run_number }}-${{ github.run_attempt }}
          path: quant_research/state/full_v3/
          retention-days: 30
