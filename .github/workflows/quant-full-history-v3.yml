name: A-share SHSZ Full History V3

on:
  push:
    paths:
      - ".github/workflows/quant-full-history-v3.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "start / continue / reset"
        required: true
        default: "continue"
        type: choice
        options:
          - continue
          - start
          - reset

permissions:
  contents: write
  actions: write

concurrency:
  group: ashare-shsz-full-history-v3
  cancel-in-progress: false

env:
  START_DATE: "2016-01-01"
  CHUNK_SIZE: "500"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "baostock>=0.9.4" "pandas>=2.2" "numpy>=1.26" "pyarrow>=15" "akshare>=1.17"

      - name: Restore latest cumulative cache
        uses: actions/cache/restore@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-${{ github.run_number }}
          restore-keys: |
            ashare-shsz-full-v3-

      - name: Reset state when requested
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'reset'
        run: |
          rm -rf quant_research/full_cache
          rm -rf quant_research/state/full_v3
          mkdir -p quant_research/full_cache/daily quant_research/state/full_v3

      - name: Build or reuse frozen SH/SZ universe and audit BSE gap
        run: |
          mkdir -p quant_research/full_cache/daily quant_research/state/full_v3
          python - <<'PY'
          import json
          import os
          import time
          from datetime import date
          from pathlib import Path

          import baostock as bs
          import pandas as pd

          ROOT = Path("quant_research/state/full_v3")
          START = pd.Timestamp(os.getenv("START_DATE", "2016-01-01"))
          END = pd.Timestamp(date.today().isoformat())
          UNIVERSE = ROOT / "universe_shsz_frozen.csv"
          META = ROOT / "universe_meta.json"

          def rs_to_df(rs):
              rows = []
              while rs.error_code == "0" and rs.next():
                  rows.append(rs.get_row_data())
              if rs.error_code != "0":
                  raise RuntimeError(f"{rs.error_code}: {rs.error_msg}")
              return pd.DataFrame(rows, columns=rs.fields)

          def get_basic_with_retry():
              last = None
              for attempt in range(8):
                  try:
                      lg = bs.login()
                      if lg.error_code != "0":
                          raise RuntimeError(f"login {lg.error_code}: {lg.error_msg}")
                      df = rs_to_df(bs.query_stock_basic())
                      bs.logout()
                      return df
                  except Exception as exc:
                      last = exc
                      try:
                          bs.logout()
                      except Exception:
                          pass
                      time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f"query_stock_basic failed after retries: {last}")

          if not UNIVERSE.exists():
              raw = get_basic_with_retry()
              s = raw[raw["type"].astype(str) == "1"].copy()
              for c in ["ipoDate", "outDate", "status"]:
                  s[c] = s[c].fillna("").astype(str)
              s["ipo_dt"] = pd.to_datetime(s["ipoDate"], errors="coerce")
              s["out_dt"] = pd.to_datetime(s["outDate"], errors="coerce")
              s = s[
                  (s["ipo_dt"].isna() | (s["ipo_dt"] <= END)) &
                  (s["out_dt"].isna() | (s["out_dt"] >= START))
              ].copy()
              s = s[s["code"].str.match(r"^(sh|sz)\.\d{6}$", na=False)]
              s = s.sort_values(["status", "ipo_dt", "code"]).reset_index(drop=True)
              s.drop(columns=["ipo_dt", "out_dt"], errors="ignore").to_csv(UNIVERSE, index=False)
              meta = {
                  "frozen_at": date.today().isoformat(),
                  "period_start": str(START.date()),
                  "period_end": str(END.date()),
                  "shsz_total": int(len(s)),
                  "active": int((s["status"] == "1").sum()),
                  "delisted": int((s["status"] == "0").sum()),
                  "source": "BaoStock query_stock_basic",
                  "scope": "SH/SZ only; BSE deliberately audited separately"
              }
              META.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(meta, ensure_ascii=False))
          else:
              print(f"Reusing frozen universe: {UNIVERSE}")

          # BSE coverage audit only. Run once; failure is non-fatal and never gets silently folded into SH/SZ.
          AUDIT = ROOT / "bse_coverage_audit.json"
          if not AUDIT.exists():
              audit = {
                  "checked_at": date.today().isoformat(),
                  "status": "UNKNOWN",
                  "current_bse_count": None,
                  "source": "AKShare stock_info_bj_name_code",
                  "historical_delisted_bse_complete": False,
                  "note": "BSE historical/delisted coverage must be completed before labeling the model 'full A-share'."
              }
              try:
                  import akshare as ak
                  bj = ak.stock_info_bj_name_code()
                  bj.to_csv(ROOT / "bse_current_snapshot.csv", index=False)
                  audit["status"] = "CURRENT_LIST_OK"
                  audit["current_bse_count"] = int(len(bj))
              except Exception as exc:
                  audit["status"] = "CURRENT_LIST_FAILED"
                  audit["error"] = str(exc)[:500]
              AUDIT.write_text(
                  json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print(json.dumps(audit, ensure_ascii=False))
          else:
              print(f"Reusing BSE audit: {AUDIT}")
          PY

      - name: Collect next sequential chunk
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import signal
          import time
          from datetime import date
          from pathlib import Path

          import baostock as bs
          import numpy as np
          import pandas as pd

          START_DATE = os.getenv("START_DATE", "2016-01-01")
          CHUNK_SIZE = int(os.getenv("CHUNK_SIZE", "500"))
          END_DATE = date.today().isoformat()

          ROOT = Path("quant_research")
          STATE_DIR = ROOT / "state" / "full_v3"
          CACHE_DIR = ROOT / "full_cache" / "daily"
          CACHE_DIR.mkdir(parents=True, exist_ok=True)
          STATE_DIR.mkdir(parents=True, exist_ok=True)

          UNIVERSE_PATH = STATE_DIR / "universe_shsz_frozen.csv"
          PROGRESS_PATH = STATE_DIR / "progress.json"
          MANIFEST_PATH = STATE_DIR / "history_manifest.csv"
          CHUNK_PATH = STATE_DIR / f"chunk_{os.getenv('GITHUB_RUN_NUMBER','0')}.csv"

          FIELDS = (
              "date,code,open,high,low,close,preclose,volume,amount,"
              "adjustflag,turn,tradestatus,pctChg,isST,"
              "peTTM,pbMRQ,psTTM,pcfNcfTTM"
          )

          class QueryTimeout(Exception):
              pass

          def alarm_handler(signum, frame):
              raise QueryTimeout("query exceeded 60 seconds")

          signal.signal(signal.SIGALRM, alarm_handler)

          def login():
              last = None
              for attempt in range(6):
                  try:
                      signal.alarm(25)
                      lg = bs.login()
                      signal.alarm(0)
                      if lg.error_code == "0":
                          return
                      last = RuntimeError(f"{lg.error_code}: {lg.error_msg}")
                  except Exception as exc:
                      signal.alarm(0)
                      last = exc
                  time.sleep(min(15, 1 + attempt * 2))
              raise RuntimeError(f"BaoStock login failed: {last}")

          def logout():
              try:
                  bs.logout()
              except Exception:
                  pass

          def rs_to_df(rs):
              rows = []
              while rs.error_code == "0" and rs.next():
                  rows.append(rs.get_row_data())
              if rs.error_code != "0":
                  raise RuntimeError(f"{rs.error_code}: {rs.error_msg}")
              return pd.DataFrame(rows, columns=rs.fields)

          def normalize(df):
              if df.empty:
                  return df
              df = df.copy()
              df["date"] = pd.to_datetime(df["date"], errors="coerce")
              numeric = [
                  "open","high","low","close","preclose","volume","amount",
                  "turn","pctChg","peTTM","pbMRQ","psTTM","pcfNcfTTM"
              ]
              for c in numeric:
                  if c in df.columns:
                      df[c] = pd.to_numeric(df[c], errors="coerce")
              for c in ["tradestatus", "isST", "adjustflag"]:
                  if c in df.columns:
                      df[c] = df[c].fillna("").astype(str)
              return (
                  df.dropna(subset=["date"])
                    .drop_duplicates(["date","code"], keep="last")
                    .sort_values("date")
                    .reset_index(drop=True)
              )

          def fetch(code, start_s, end_s):
              last = None
              for attempt in range(4):
                  try:
                      signal.alarm(60)
                      rs = bs.query_history_k_data_plus(
                          code, FIELDS,
                          start_date=start_s,
                          end_date=end_s,
                          frequency="d",
                          adjustflag="2",
                      )
                      raw = rs_to_df(rs)
                      signal.alarm(0)
                      raw_dup = 0
                      if not raw.empty and "date" in raw.columns:
                          keys = ["date"] + (["code"] if "code" in raw.columns else [])
                          raw_dup = int(raw.duplicated(keys, keep=False).sum())
                      return normalize(raw), raw_dup
                  except Exception as exc:
                      signal.alarm(0)
                      last = exc
                      logout()
                      time.sleep(min(12, 2 + attempt * 2))
                      login()
              raise RuntimeError(str(last))

          def effective_start(row):
              ipo = pd.to_datetime(row.get("ipoDate", ""), errors="coerce")
              s = pd.Timestamp(START_DATE)
              return (max(s, ipo) if pd.notna(ipo) else s).strftime("%Y-%m-%d")

          def effective_end(row):
              out = pd.to_datetime(row.get("outDate", ""), errors="coerce")
              e = pd.Timestamp(END_DATE)
              return (min(e, out) if pd.notna(out) else e).strftime("%Y-%m-%d")

          def quality(df):
              if df.empty:
                  return {
                      "duplicate_dates": 0,
                      "actual_nonpositive_close": 0,
                      "missing_close_trading": 0,
                      "missing_close_suspended": 0,
                      "bad_ohlc_rows": 0,
                  }
              trad = df["tradestatus"].astype(str) if "tradestatus" in df else pd.Series("", index=df.index)
              close = df["close"]
              actual_nonpos = int((close.notna() & (close <= 0)).sum())
              missing_trading = int(((trad == "1") & close.isna()).sum())
              missing_suspended = int(((trad == "0") & close.isna()).sum())
              valid = (
                  (trad == "1") &
                  df[["open","high","low","close"]].notna().all(axis=1)
              )
              high_ref = df.loc[valid, ["open","close","low"]].max(axis=1)
              low_ref = df.loc[valid, ["open","close","high"]].min(axis=1)
              bad = int(
                  ((df.loc[valid, "high"] < high_ref) |
                   (df.loc[valid, "low"] > low_ref)).sum()
              )
              return {
                  "duplicate_dates": int(df["date"].duplicated().sum()),
                  "actual_nonpositive_close": actual_nonpos,
                  "missing_close_trading": missing_trading,
                  "missing_close_suspended": missing_suspended,
                  "bad_ohlc_rows": bad,
              }

          universe = pd.read_csv(UNIVERSE_PATH, dtype=str)
          if PROGRESS_PATH.exists():
              progress = json.loads(PROGRESS_PATH.read_text(encoding="utf-8"))
          else:
              progress = {
                  "cursor": 0,
                  "completed": False,
                  "started_at": date.today().isoformat(),
                  "universe_size": int(len(universe)),
              }

          cursor = int(progress.get("cursor", 0))
          end_idx = min(cursor + CHUNK_SIZE, len(universe))
          batch = universe.iloc[cursor:end_idx].copy()

          print(f"Processing SH/SZ frozen universe [{cursor}:{end_idx}] / {len(universe)}", flush=True)

          rows = []
          login()
          try:
              for pos, (_, row) in enumerate(batch.iterrows(), start=1):
                  code = row["code"]
                  path = CACHE_DIR / f"{code.replace('.','_')}.parquet"
                  try:
                      if path.exists():
                          df = normalize(pd.read_parquet(path))
                          # Incremental refresh only when needed.
                          if not df.empty:
                              last_dt = df["date"].max()
                              next_dt = (last_dt + pd.Timedelta(days=1)).strftime("%Y-%m-%d")
                              end_s = effective_end(row)
                              if pd.Timestamp(next_dt) <= pd.Timestamp(end_s):
                                  inc, raw_dup = fetch(code, next_dt, end_s)
                                  if not inc.empty:
                                      df = normalize(pd.concat([df, inc], ignore_index=True))
                                      df.to_parquet(path, index=False)
                              else:
                                  raw_dup = 0
                          else:
                              raw_dup = 0
                          source = "cache+incremental"
                      else:
                          start_s = effective_start(row)
                          end_s = effective_end(row)
                          if pd.Timestamp(start_s) <= pd.Timestamp(end_s):
                              df, raw_dup = fetch(code, start_s, end_s)
                          else:
                              df, raw_dup = pd.DataFrame(), 0
                          if not df.empty:
                              df.to_parquet(path, index=False)
                          source = "baostock"

                      q = quality(df)
                      rows.append({
                          "code": code,
                          "code_name": row.get("code_name",""),
                          "status": row.get("status",""),
                          "ipoDate": row.get("ipoDate",""),
                          "outDate": row.get("outDate",""),
                          "rows": int(len(df)),
                          "min_date": "" if df.empty else str(df["date"].min().date()),
                          "max_date": "" if df.empty else str(df["date"].max().date()),
                          "result": "ok" if len(df) else "empty",
                          "source": source,
                          "error": "",
                          "raw_duplicate_rows": int(raw_dup),
                          **q,
                      })
                  except Exception as exc:
                      rows.append({
                          "code": code,
                          "code_name": row.get("code_name",""),
                          "status": row.get("status",""),
                          "ipoDate": row.get("ipoDate",""),
                          "outDate": row.get("outDate",""),
                          "rows": 0,
                          "min_date": "",
                          "max_date": "",
                          "result": "error",
                          "source": "baostock",
                          "error": str(exc)[:500],
                          "raw_duplicate_rows": 0,
                          "duplicate_dates": 0,
                          "actual_nonpositive_close": 0,
                          "missing_close_trading": 0,
                          "missing_close_suspended": 0,
                          "bad_ohlc_rows": 0,
                      })

                  if pos == 1 or pos % 25 == 0 or pos == len(batch):
                      ok = sum(x["result"] == "ok" for x in rows)
                      err = sum(x["result"] == "error" for x in rows)
                      print(f"{pos}/{len(batch)} ok={ok} error={err} latest={code}", flush=True)
                  time.sleep(0.05)
          finally:
              logout()

          chunk = pd.DataFrame(rows)
          chunk.to_csv(CHUNK_PATH, index=False)

          if MANIFEST_PATH.exists():
              old = pd.read_csv(MANIFEST_PATH, dtype={"status": str})
              merged = pd.concat([old, chunk], ignore_index=True)
              merged = merged.drop_duplicates("code", keep="last").sort_values("code")
          else:
              merged = chunk.sort_values("code")
          merged.to_csv(MANIFEST_PATH, index=False)

          progress["cursor"] = int(end_idx)
          progress["completed"] = bool(end_idx >= len(universe))
          progress["universe_size"] = int(len(universe))
          progress["downloaded_codes"] = int(len(merged))
          progress["ok_codes"] = int((merged["result"] == "ok").sum())
          progress["error_codes"] = int((merged["result"] == "error").sum())
          progress["empty_codes"] = int((merged["result"] == "empty").sum())
          progress["last_run_number"] = os.getenv("GITHUB_RUN_NUMBER", "")
          progress["updated_at"] = date.today().isoformat()
          PROGRESS_PATH.write_text(
              json.dumps(progress, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          if progress["completed"]:
              ok = merged[merged["result"] == "ok"]
              final = {
                  "status": "READY_FOR_MODEL" if len(ok) >= int(len(universe) * 0.95) else "NEEDS_REPAIR",
                  "scope": "SH/SZ historical universe only",
                  "universe_size": int(len(universe)),
                  "ok_codes": int(len(ok)),
                  "error_codes": int((merged["result"] == "error").sum()),
                  "empty_codes": int((merged["result"] == "empty").sum()),
                  "delisted_total": int((universe["status"].astype(str) == "0").sum()),
                  "delisted_ok": int(((merged["status"].astype(str) == "0") & (merged["result"] == "ok")).sum()),
                  "rows": int(ok["rows"].sum()),
                  "raw_duplicate_rows": int(ok["raw_duplicate_rows"].sum()),
                  "normalized_duplicate_dates": int(ok["duplicate_dates"].sum()),
                  "actual_nonpositive_close": int(ok["actual_nonpositive_close"].sum()),
                  "missing_close_trading": int(ok["missing_close_trading"].sum()),
                  "missing_close_suspended": int(ok["missing_close_suspended"].sum()),
                  "bad_ohlc_rows": int(ok["bad_ohlc_rows"].sum()),
                  "bse_included": False,
                  "note": "BSE remains a separately tracked coverage gap; do not label this full A-share yet."
              }
              (STATE_DIR / "final_quality_summary.json").write_text(
                  json.dumps(final, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print(json.dumps(final, ensure_ascii=False, indent=2))
          else:
              print(json.dumps(progress, ensure_ascii=False, indent=2))
          PY

      - name: Commit progress and compact manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_research/state/full_v3/
          if ! git diff --cached --quiet; then
            git commit -m "quant: advance SHSZ full-history cursor"
            git pull --rebase origin main
            git push
          fi

      - name: Save cumulative history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-${{ github.run_number }}

      - name: Read completion state
        id: state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path("quant_research/state/full_v3/progress.json")
          d=json.loads(p.read_text())
          print(f"completed={'true' if d.get('completed') else 'false'}")
          print(f"cursor={d.get('cursor',0)}")
          print(f"universe_size={d.get('universe_size',0)}")
          PY

      - name: Self-dispatch next chunk
        if: steps.state.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching next sequential chunk at cursor ${{ steps.state.outputs.cursor }}/${{ steps.state.outputs.universe_size }}"
          gh workflow run quant-full-history-v3.yml --ref main -f action=continue

      - name: Upload compact state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shsz-full-v3-state-${{ github.run_number }}
          path: quant_research/state/full_v3/
          retention-days: 30
