name: RQAlpha isolated compatibility probe
on:
  push:
    branches: [feature/paper-execution-safety-v1]
    paths: ['.github/workflows/rqalpha-research-probe.yml', 'quant_research/scripts/paper_calendar_provider_v1.py', 'quant_research/scripts/paper_rqalpha_match_probe_v1.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/feature/paper-execution-safety-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research dependency
        run: python -m pip install 'rqalpha==6.5.0'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify imports only (no orders, no account, no market data)
        run: |
          python - <<'PY'
          import importlib
          from importlib.metadata import version
          assert version("rqalpha") == "6.5.0"
          for name in (
              "rqalpha.data.trading_dates_mixin",
              "rqalpha.mod.rqalpha_mod_sys_simulation.matcher.bar_matcher",
              "rqalpha.portfolio.position",
              "rqalpha.portfolio.account",
          ):
              importlib.import_module(name)
              print("IMPORT_OK", name)
          print("IMPORT_COMPATIBILITY_ONLY; execution and data not verified")
          PY
      - name: Exercise trading calendar against synthetic holiday fixture
        run: |
          python - <<'PY'
          import pandas as pd
          from datetime import date
          from rqalpha.const import TRADING_CALENDAR_TYPE
          from rqalpha.data.trading_dates_mixin import TradingDatesMixin
          class Fixture:
              def get_trading_calendars(self):
                  return {TRADING_CALENDAR_TYPE.CN_STOCK: pd.DatetimeIndex(
                      ["2026-09-29", "2026-09-30", "2026-10-09", "2026-10-12"])}
          calendar = TradingDatesMixin(Fixture())
          assert calendar.is_trading_date(date(2026, 9, 30))
          assert not calendar.is_trading_date(date(2026, 10, 1))
          assert calendar.get_next_trading_date("2026-09-30") == pd.Timestamp("2026-10-09")
          assert calendar.get_previous_trading_date("2026-10-09") == pd.Timestamp("2026-09-30")
          assert len(calendar.get_trading_dates("2026-09-30", "2026-10-09")) == 2
          # Document the library's boundary clamping; never treat it as future-session evidence.
          assert calendar.get_next_trading_date("2026-10-12") == pd.Timestamp("2026-10-12")
          print("SYNTHETIC_CALENDAR_OK; real exchange calendar not verified")
          PY
      - name: Fetch actual BaoStock sessions and raw quote in read-only mode
        timeout-minutes: 4
        run: |
          python -m pip install baostock
          python - <<'PY'
          import baostock as bs
          import pandas as pd
          from rqalpha.const import TRADING_CALENDAR_TYPE
          from rqalpha.data.trading_dates_mixin import TradingDatesMixin
          def rows(result):
              if result.error_code != "0":
                  raise RuntimeError(result.error_msg)
              data = []
              while result.next():
                  data.append(result.get_row_data())
              if result.error_code != "0":
                  raise RuntimeError(result.error_msg)
              return pd.DataFrame(data, columns=result.fields)
          login = bs.login()
          if login.error_code != "0":
              raise RuntimeError(login.error_msg)
          try:
              days = rows(bs.query_trade_dates(start_date="2026-09-01", end_date="2026-11-23"))
              assert len(days) == 84, "Incomplete calendar coverage"
              assert days.calendar_date.is_unique
              assert list(days.calendar_date) == pd.date_range("2026-09-01", "2026-11-23").strftime("%Y-%m-%d").tolist()
              assert set(days.is_trading_day) <= {"0", "1"}
              sessions = pd.DatetimeIndex(days.loc[days.is_trading_day == "1", "calendar_date"])
              class Source:
                  def get_trading_calendars(self):
                      return {TRADING_CALENDAR_TYPE.CN_STOCK: sessions}
              calendar = TradingDatesMixin(Source())
              assert pd.Timestamp("2026-11-23") in sessions
              assert calendar.get_next_trading_date("2026-09-30") > pd.Timestamp("2026-10-01")
              q = rows(bs.query_history_k_data_plus("sh.600000", "date,code,open,close,preclose,volume,adjustflag,tradestatus,isST", start_date="2026-11-23", end_date="2026-11-23", frequency="d", adjustflag="3"))
              assert len(q) == 1 and q.iloc[0]["date"] == "2026-11-23"
              assert q.iloc[0]["adjustflag"] == "3"
              for field in ("open", "close", "preclose", "volume"):
                  assert float(q.iloc[0][field]) > 0
              print("BAOSTOCK_SESSION_COUNT", len(sessions))
              print("RAW_QUOTE", q.to_json(orient="records"))
              q.to_json("/tmp/rqalpha_raw_quote.json", orient="records")
              print("REAL_PROVIDER_PROBE_ONLY; exchange cross-check and execution not verified")
          finally:
              bs.logout()
          PY
      - name: Verify calendar provider and isolated ledger end-to-end
        timeout-minutes: 6
        run: |
          python -m pip install pytest pyarrow
          PYTHONPATH=quant_research/scripts python - <<'PY'
          from paper_calendar_provider_v1 import fetch_sessions, sessions_from_rows
          from paper_exchange_calendar_v1 import month_end_signal
          from datetime import date
          days = fetch_sessions("2026-09-01", "2026-11-23")
          assert month_end_signal("2026-09-30", days)
          assert not month_end_signal("2026-09-29", days)
          try:
              month_end_signal("2026-11-23", days)
          except ValueError:
              pass
          else:
              raise AssertionError("Truncated calendar accepted")
          try:
              sessions_from_rows([], date(2026,9,1), date(2026,9,2))
          except ValueError:
              pass
          else:
              raise AssertionError("Incomplete calendar accepted")
          print("PROVIDER_OK")
          PY
          python -m pytest -q quant_research/tests/test_paper_exchange_calendar_v1.py quant_research/tests/test_paper_shadow_account_v1.py quant_research/tests/test_paper_volume_cap_v1.py
      - name: Exercise actual matcher using historical raw quote
        run: |
          PYTHONPATH=quant_research/scripts python - <<'PY'
          import json
          from paper_rqalpha_match_probe_v1 import match_probe
          from paper_shadow_account_v1 import eligible_open
          from decimal import Decimal
          q = json.load(open("/tmp/rqalpha_raw_quote.json"))[0]
          q["last_quote_day"] = q["date"]
          assert q["adjustflag"] == "3"
          assert eligible_open("sh.600000", q, q["date"], "buy")
          result = match_probe(float(q["open"]), float(q["volume"]))
          shares = result["shares"]
          price = Decimal(str(result["price"]))
          gross = price * shares
          fee = gross * Decimal("0.0015")
          cash = Decimal("1000000") - gross - fee
          equity = cash + Decimal(str(q["close"])) * shares
          assert shares == 100 and cash >= 0
          assert equity - Decimal("1000000") == (Decimal(str(q["close"]))-price)*shares-fee
          print(json.dumps({"test_only": True, "shares": shares, "cash": str(cash),
              "fee": str(fee), "equity": str(equity), "matching": result}))
          PY
      - name: Historical round-trip matching and reconciliation
        timeout-minutes: 4
        run: |
          PYTHONPATH=quant_research/scripts python - <<'PY'
          import json
          import baostock as bs
          from paper_rqalpha_match_probe_v1 import round_trip_probe
          from paper_calendar_provider_v1 import fetch_sessions
          sessions = fetch_sessions("2026-11-20", "2026-11-23")
          assert bs.login().error_code == "0"
          try:
              r = bs.query_history_k_data_plus("sh.600000",
                  "date,open,close,preclose,volume,adjustflag,tradestatus,isST",
                  start_date="2026-11-20",end_date="2026-11-23",frequency="d",adjustflag="3")
              rows = []
              while r.error_code == "0" and r.next():
                  q = dict(zip(r.fields,r.get_row_data()))
                  q["last_quote_day"] = q["date"]
                  rows.append(q)
              assert r.error_code == "0" and len(rows) == 2
              assert [q["date"] for q in rows] == sessions
              print(json.dumps(round_trip_probe(*rows,sessions),ensure_ascii=False))
          finally:
              bs.logout()
          PY
