name: RQAlpha isolated compatibility probe
on:
  push:
    branches: [feature/paper-execution-safety-v1]
    paths: ['.github/workflows/rqalpha-research-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/feature/paper-execution-safety-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research dependency
        run: python -m pip install 'rqalpha==6.5.0'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify imports only (no orders, no account, no market data)
        run: |
          python - <<'PY'
          import importlib
          from importlib.metadata import version
          assert version("rqalpha") == "6.5.0"
          for name in (
              "rqalpha.data.trading_dates_mixin",
              "rqalpha.mod.rqalpha_mod_sys_simulation.matcher.bar_matcher",
              "rqalpha.portfolio.position",
              "rqalpha.portfolio.account",
          ):
              importlib.import_module(name)
              print("IMPORT_OK", name)
          print("IMPORT_COMPATIBILITY_ONLY; execution and data not verified")
          PY
