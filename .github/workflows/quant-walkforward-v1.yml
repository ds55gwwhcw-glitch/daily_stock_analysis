name: A-share Walk-forward Research V1

on:
  push:
    paths:
      - .github/workflows/quant-walkforward-v1.yml
      - quant_research/scripts/quant_walkforward_v1.py
      - quant_research/tests/test_quant_walkforward_v1.py
      - quant_research/scripts/publish_paper_snapshot_v1.py
      - quant_research/scripts/paper_shadow_account_v1.py
      - quant_research/tests/test_paper_shadow_account_v1.py
      - quant_research/scripts/paper_performance_report_v1.py
      - quant_research/tests/test_paper_performance_report_v1.py
      - quant_research/tests/test_daily_incremental_v1.py
      - quant_research/scripts/daily_incremental_v1.py
  workflow_dispatch:
    inputs:
      mode:
        description: validate eligible universe or research after strict gate
        required: true
        default: validate
        type: choice
        options: [validate, research]

permissions:
  contents: write

concurrency:
  group: ashare-walkforward-v1
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      MODE: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'validate' || (github.event.inputs.mode || 'research') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install 'pandas>=2.2' 'numpy>=1.26' 'pyarrow>=15' 'pytest>=8' 'baostock>=0.9.4'
      - name: Run unit tests
        run: python -m pytest -q quant_research/tests/test_quant_walkforward_v1.py quant_research/tests/test_paper_shadow_account_v1.py quant_research/tests/test_paper_performance_report_v1.py quant_research/tests/test_daily_incremental_v1.py
      - name: Restore historical V3 parquet cache
        if: env.MODE == 'research'
        uses: actions/cache/restore@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-research-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ashare-shsz-full-v3-
      - name: Research-gated board audit and walk-forward
        run: python quant_research/scripts/quant_walkforward_v1.py --mode "$MODE"
      - name: Publish fresh research candidate audit (no orders)
        if: env.MODE == 'research'
        run: python quant_research/scripts/publish_paper_snapshot_v1.py
      - name: Update hypothetical paper account without broker connection
        if: env.MODE == 'research'
        run: python quant_research/scripts/paper_shadow_account_v1.py
      - name: Generate read-only virtual performance report
        if: env.MODE == 'research'
        run: python quant_research/scripts/paper_performance_report_v1.py
      - name: Commit lightweight research signal history
        if: env.MODE == 'research'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quant_research/state/paper_v1/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'quant: save gated research-only candidate snapshot'
          for attempt in 1 2 3 4 5; do
            if git fetch origin main; then
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            sleep $((10 * attempt))
          done
          exit 1
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-v1-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            quant_research/results/walkforward_v1/
            quant_research/state/paper_v1/
          if-no-files-found: warn
          retention-days: 30
