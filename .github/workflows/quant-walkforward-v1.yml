name: A-share Walk-forward Research V1

on:
  push:
    paths:
      - .github/workflows/quant-walkforward-v1.yml
  workflow_dispatch:
    inputs:
      mode:
        description: validate eligible universe or research after strict gate
        required: true
        default: validate
        type: choice
        options: [validate, research]

permissions:
  contents: read

concurrency:
  group: ashare-walkforward-v1
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      MODE: ${{ github.event.inputs.mode || 'validate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install 'pandas>=2.2' 'numpy>=1.26' 'pyarrow>=15' 'pytest>=8'
      - name: Run unit tests
        run: python -m pytest -q quant_research/tests/test_quant_walkforward_v1.py
      - name: Restore historical V3 parquet cache
        if: env.MODE == 'research'
        uses: actions/cache/restore@v4
        with:
          path: quant_research/full_cache
          key: ashare-shsz-full-v3-research-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            ashare-shsz-full-v3-
      - name: Research-gated board audit and walk-forward
        run: python quant_research/scripts/quant_walkforward_v1.py --mode "$MODE"
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-v1-${{ github.run_number }}-${{ github.run_attempt }}
          path: quant_research/results/walkforward_v1/
          if-no-files-found: warn
          retention-days: 30
