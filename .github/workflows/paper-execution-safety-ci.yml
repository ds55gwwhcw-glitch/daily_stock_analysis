name: A-share Paper Execution Safety CI

on:
  push:
    branches:
      - feature/paper-execution-safety-v1
    paths:
      - quant_research/scripts/paper_exchange_calendar_v1.py
      - quant_research/tests/test_paper_exchange_calendar_v1.py
      - quant_research/scripts/paper_shadow_account_v1.py
      - quant_research/tests/test_paper_shadow_account_v1.py
      - quant_research/tests/test_paper_volume_cap_v1.py
      - .github/workflows/paper-execution-safety-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    if: github.ref == 'refs/heads/feature/paper-execution-safety-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install 'pandas>=2.2' 'numpy>=1.26' 'pytest>=8'
      - name: Verify calendar, T+1, execution guards and idempotence
        run: python -m pytest -q quant_research/tests/test_paper_exchange_calendar_v1.py quant_research/tests/test_paper_shadow_account_v1.py quant_research/tests/test_paper_volume_cap_v1.py
